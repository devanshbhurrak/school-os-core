[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-os-api"
version = "0.1.0"
description = "School OS multi-tenant backend (Phase 1 foundation: IAM, auth, multi-tenancy)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "School OS" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.7,<3",
    "email-validator>=2.0,<3",
    "pydantic-settings>=2.1,<3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<24",
    "PyJWT>=2.8,<3",
    "structlog>=24.1,<26",
    "greenlet>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]