services:
  db:
    image: postgres:16-alpine
    container_name: school_os_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_os
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - school_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_os"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Phase 3: local Redis for distributed rate limiting + outbox dispatcher locks.
  # Production uses Upstash (REDIS_URL=rediss://...); this container is for dev.
  redis:
    image: redis:7-alpine
    container_name: school_os_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - school_os_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Phase 3: local S3-compatible storage (mirrors Cloudflare R2 API).
  # Production uses R2 (S3_ENDPOINT=https://<account>.r2.cloudflarestorage.com).
  minio:
    image: minio/minio:latest
    container_name: school_os_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - school_os_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  school_os_pgdata:
  school_os_redisdata:
  school_os_miniodata:
